[project]
name = "agent-3d-py"
version = "0.1.0"
description = "A synthetic scene agent using Microsoft Agent Framework."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "agent-framework-core==1.21.0",
    "agent-framework-ag-ui==1.5.1",
    "agent-framework-openai==1.16.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_3d"]

[project.scripts]
agent-3d = "agent_3d.app:main"
agent-3d-hosted = "agent_3d.hosted:main"

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]
foundry = [
    "agent-framework-foundry==1.14.1",
    "agent-framework-foundry-hosting==1.0.0b261008",
    "azure-ai-agentserver-core==2.2.0",
    "azure-ai-agentserver-invocations==1.2.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.15,<1",
    "ty>=0.0.20,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
